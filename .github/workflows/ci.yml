name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lecturelens
          POSTGRES_PASSWORD: lecturelens
          POSTGRES_DB: lecturelens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lecturelens"
          --health-interval 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://lecturelens:lecturelens@localhost:5432/lecturelens_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg, espeak-ng, tesseract
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # man-db rebuilds its cache on every install and can hang the job
          echo "set man-db/auto-update false" | sudo debconf-communicate
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg espeak-ng tesseract-ocr tesseract-ocr-eng
      - uses: actions/cache@v4
        with:
          path: models
          key: models-v1
      - run: ../scripts/get_models.sh
      - run: pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lecturelens-backend backend
