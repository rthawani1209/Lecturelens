name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Debian container: deb.debian.org is a CDN, and the runner's Azure Ubuntu
    # mirror has been crawling at ~50 KB/s for ffmpeg's dependencies
    container: python:3.12-bookworm
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lecturelens
          POSTGRES_PASSWORD: lecturelens
          POSTGRES_DB: lecturelens_test
        options: >-
          --health-cmd "pg_isready -U lecturelens -d lecturelens_test"
          --health-interval 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://lecturelens:lecturelens@postgres:5432/lecturelens_test
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg, espeak-ng, tesseract
        timeout-minutes: 10
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            ffmpeg espeak-ng tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
      - uses: actions/cache@v4
        with:
          path: models
          key: models-v1
      - run: ../scripts/get_models.sh
      - run: pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: ruff check --config pyproject.toml ../ml ../scripts && ruff format --config pyproject.toml --check ../ml ../scripts
      - run: pytest -q

  ml:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - uses: actions/cache@v4
        with:
          path: models
          key: models-v1
      - run: scripts/get_models.sh
      - run: pip install -r ml/requirements.txt
      # loads the SavedModels TF Serving runs
      - run: python -m pytest -q ml/tests

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx prettier --check .
      - run: npx eslint --max-warnings 0 .
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: python:3.12-bookworm
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lecturelens
          POSTGRES_PASSWORD: lecturelens
          POSTGRES_DB: lecturelens
        options: >-
          --health-cmd "pg_isready -U lecturelens" --health-interval 3s --health-retries 20
      redis:
        image: redis:7
    env:
      E2E_DATABASE_URL: postgresql://lecturelens:lecturelens@postgres:5432/lecturelens_e2e
      E2E_REDIS_URL: redis://redis:6379/5
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg, espeak-ng, tesseract
        timeout-minutes: 10
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            ffmpeg espeak-ng tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache@v4
        with:
          path: models
          key: models-v1
      - run: scripts/get_models.sh
      - run: pip install -e 'backend[dev]'
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: scripts/e2e.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lecturelens-backend backend
      - run: docker build -t lecturelens-frontend frontend
