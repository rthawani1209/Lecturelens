name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lecturelens
          POSTGRES_PASSWORD: lecturelens
          POSTGRES_DB: lecturelens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lecturelens"
          --health-interval 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://lecturelens:lecturelens@localhost:5432/lecturelens_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng tesseract-ocr
      - uses: actions/cache@v4
        with:
          path: models
          key: models-v1
      - run: ../scripts/get_models.sh
      - run: pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lecturelens-backend backend
