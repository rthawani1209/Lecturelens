# Builds the model + demo-course bundle and publishes it as GitHub release assets.
# Run by hand from the Actions tab. Everything else (dev boxes, CI, Docker builds)
# downloads from the release instead of hitting Hugging Face or OCW again.
name: Data bundle

on:
  workflow_dispatch:
    inputs:
      course:
        description: "Which OCW course to mirror"
        type: choice
        default: "6.006"
        options: ["6.006", "6.100L", "18.06"]
      models:
        description: "Rebuild the model bundle too"
        type: boolean
        default: false
      limit:
        description: "Only fetch the first N lectures (0 = all)"
        default: "0"

permissions:
  contents: write

jobs:
  models:
    if: inputs.models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
      - run: pip install "transformers>=4.44,<5" huggingface_hub onnx onnxruntime numpy
      - run: python scripts/fetch_models.py --out models
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf models.tar.gz models
          gh release view models-v1 >/dev/null 2>&1 || \
            gh release create models-v1 --title "Pretrained models v1" \
              --notes "faster-whisper base.en, all-MiniLM-L6-v2 (ONNX), CLIP ViT-B/32 (ONNX). Built by the Data bundle workflow."
          gh release upload models-v1 models.tar.gz --clobber

  lectures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yt-dlp
      - name: Fetch
        env:
          COURSE: ${{ inputs.course }}
          LIMIT: ${{ inputs.limit }}
        run: |
          case "$COURSE" in
            6.006) slug=6-006-introduction-to-algorithms-spring-2020 ;;
            6.100L) slug=6-100l-introduction-to-cs-and-programming-using-python-fall-2022 ;;
            18.06) slug=18-06-linear-algebra-spring-2010 ;;
          esac
          python scripts/fetch_ocw.py --course "$slug" --out "data/ocw/$COURSE" --limit "$LIMIT"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          COURSE: ${{ inputs.course }}
        run: |
          # 6.006 keeps its original tag so existing downloads still work
          tag="ocw-$(echo "$COURSE" | tr 'A-Z' 'a-z')"
          [ "$COURSE" = 6.006 ] && tag=ocw-6.006-s20
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "Course: MIT $COURSE" \
              --notes "Lecture videos and captions from MIT OpenCourseWare (https://ocw.mit.edu), licensed CC BY-NC-SA 4.0. Mirrored here so the demo can be rebuilt without scraping OCW."
          gh release upload "$tag" "data/ocw/$COURSE"/* --clobber
