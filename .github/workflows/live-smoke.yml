# Runs deploy/smoke.py against a live site, from outside it: demo sign-in, upload,
# processing, search and playback over real HTTPS.
name: Live smoke test

on:
  workflow_dispatch:
    inputs:
      url: {description: "site to check, e.g. https://1.2.3.4.sslip.io", required: true}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Test video (2 minutes of MIT 18.06, lecture 1)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          rel=https://github.com/rthawani1209/lecturelens/releases/download/ocw-18.06
          curl -fsSL --retry 3 -o lec01.mp4 "$rel/lec01.mp4"
          ffmpeg -loglevel error -ss 60 -t 120 -i lec01.mp4 -c copy clip.mp4
      - run: python3 deploy/smoke.py "$URL" clip.mp4 "solve a system of linear equations" --timeout 1800
        env:
          URL: ${{ inputs.url }}
