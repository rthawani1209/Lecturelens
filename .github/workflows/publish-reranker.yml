# Builds the re-ranker SavedModel from the committed weights
# (backend/lecturelens/assets/rerank_mlp.npz) and publishes it as the reranker-v1
# release, which scripts/get_models.sh downloads for TF Serving. Run it again
# after retraining.
name: Publish re-ranker

on:
  workflow_dispatch:
    inputs:
      tag: {description: "release tag", required: true, default: "reranker-v1"}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r ml/requirements.txt
      - run: python ml/rerank/export.py
      - run: python -m pytest -q ml/tests/test_saved_models.py -k rerank
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          tar -czf reranker.tar.gz models/reranker
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target main \
            --title "Re-ranker for TF Serving" \
            --notes "SavedModel built by ml/rerank/export.py from the committed weights. Unpack in the repo root."
          gh release upload "$TAG" reranker.tar.gz --clobber
