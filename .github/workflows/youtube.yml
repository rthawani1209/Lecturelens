# Real YouTube import check. Run by hand from the Actions tab; the regular tests
# mock the download so CI doesn't depend on YouTube.
name: YouTube import

on:
  workflow_dispatch:
    inputs:
      url:
        description: "A YouTube lecture link"
        required: true

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e backend
      - run: python scripts/youtube_smoke.py "$URL"
        env:
          URL: ${{ inputs.url }}
