[project]
name = "lecturelens"
version = "0.1.0"
description = "Search recorded lectures and jump to the exact moment"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.3",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "numpy>=1.26",
  "pillow>=10.1",
  "faster-whisper>=1.1",
  "celery[redis]>=5.4",
  "boto3>=1.34",
  "onnxruntime>=1.18",
  "tokenizers>=0.19",
  "httpx>=0.27",
  "yt-dlp>=2025.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lecturelens*"]

[tool.setuptools.package-data]
lecturelens = ["assets/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "db: needs a running Postgres with pgvector (DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["lecturelens"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
