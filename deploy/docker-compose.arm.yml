# Added on ARM servers (e.g. Oracle Cloud's free Ampere VMs) by the deploy scripts.
# TF Serving only ships x86 images, so it's left out and the API and worker use
# in-process copies of the same weights (NumPy for the re-ranker, ONNX for the tagger).
services:
  serving:
    profiles: [tfserving]
  api:
    environment:
      RERANKER_URL: ""
      TAGGER_URL: ""
  worker:
    environment:
      TAGGER_URL: ""
