# Production stack for one server. bootstrap.sh writes .env next to this file and
# starts it; nothing but Caddy (80/443) is reachable from outside.
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: lecturelens  # so volumes are lecturelens_pgdata etc., whatever the folder

x-backend-env: &backend-env
  DATABASE_URL: postgresql://lecturelens:${POSTGRES_PASSWORD}@postgres:5432/lecturelens
  REDIS_URL: redis://redis:6379/0
  STORAGE_BACKEND: local
  LOCAL_STORAGE_DIR: /app/data/storage
  UPLOAD_DIR: /app/data/uploads
  MODELS_DIR: /models
  SECRET_KEY: ${SECRET_KEY}
  APP_URL: https://${SITE_ADDRESS}
  API_URL: https://${SITE_ADDRESS}/api
  COOKIE_SECURE: "true"
  DEMO_LOGIN: ${DEMO_LOGIN:-false}
  DEMO_LOGINS_PER_HOUR: ${DEMO_LOGINS_PER_HOUR:-5}
  DAILY_LECTURES_PER_USER: ${DAILY_LECTURES_PER_USER:-0}
  DAILY_LECTURES_TOTAL: ${DAILY_LECTURES_TOTAL:-0}
  DAILY_LECTURES_PER_IP: ${DAILY_LECTURES_PER_IP:-0}
  # Caddy sets X-Forwarded-For to the real client address
  TRUST_FORWARDED_FOR: "true"
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-4294967296}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-claude-haiku-5-5}
  AI_MONTHLY_TOKENS: ${AI_MONTHLY_TOKENS:-20000000}
  SMTP_URL: ${SMTP_URL:-}
  # nobody reads the server log for sign-in links; without SMTP, hide email sign-in
  EMAIL_TO_LOG: "false"
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

# every container's logs are capped, or a busy month fills the disk
x-logging: &logging
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "3"}

services:
  caddy:
    <<: *logging
    image: caddy:2
    restart: always
    ports: ["80:80", "443:443", "443:443/udp"]  # udp for HTTP/3
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      web: {condition: service_healthy}

  postgres:
    <<: *logging
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: lecturelens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lecturelens
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lecturelens"]
      interval: 3s
      retries: 20

  redis:
    <<: *logging
    image: redis:7-alpine
    restart: always
    # written to disk, so queued lectures survive a restart
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  migrate:
    <<: *logging
    build: ../backend
    command: ["python", "-m", "lecturelens.db.migrate"]
    environment: *backend-env
    # mounted here first, alone: Docker fills a new volume from the image (owned by
    # the app user), and api + worker doing that at the same moment collide
    volumes: [appdata:/app/data]
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *logging
    build: ../backend
    restart: always
    environment:
      <<: *backend-env
      RERANKER_URL: http://serving:8501
      TAGGER_URL: http://serving:8501
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 30
    volumes:
      - {type: volume, source: appdata, target: /app/data, volume: {nocopy: true}}
      - ../models:/models:ro
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  web:
    <<: *logging
    build:
      context: ../frontend
      args: {API_URL: "http://api:8000"}
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/signin').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      retries: 30
    depends_on:
      api: {condition: service_healthy}

  serving:
    <<: *logging
    image: tensorflow/serving:2.21.0
    restart: always
    command: ["--model_config_file=/config/models.config"]
    volumes:
      - ../models:/models:ro
      - ../ml/serving:/config:ro

  worker:
    <<: *logging
    build: ../backend
    restart: always
    # whisper's peaks stay inside this, so Postgres and the site keep their memory
    mem_limit: 5g
    # a stage that finishes within a minute gets to save; anything longer is requeued on start
    stop_grace_period: 60s
    # one lecture at a time: whisper and OCR use every core, and two at once can run out of memory
    command: ["celery", "-A", "lecturelens.worker", "worker", "-l", "info", "--concurrency", "1"]
    environment:
      <<: *backend-env
      TAGGER_URL: http://serving:8501
    volumes:
      - {type: volume, source: appdata, target: /app/data, volume: {nocopy: true}}
      - ../models:/models:ro
      - ../data/ocw:/ocw:ro
      - ../scripts:/scripts:ro
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

volumes:
  redisdata:
  pgdata:
  appdata:
  caddydata:
